<head>

  <meta property="og:description" content="A número 1. De líder para líder. Agende seu horário em Jundiaí.">

  <meta property="og:url" content="https://jlsanches-dev.github.io/mf-barbearia/">
  <meta property="og:image" content="https://jlsanches-dev.github.io/mf-barbearia/img/foto-1.jpg">
  <meta property="og:image:width" content="900">
  <meta property="og:image:height" content="1200">
  <meta property="og:image:alt" content="Bancada da MF Barbearia com espelhos redondos iluminados">
  <meta property="og:type" content="website">

  <meta property="og:site_name" content="MF Barbearia">
  <!-- Prévia no X/Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MF Barbearia">
  <meta name="twitter:description" content="A número 1. De líder para líder. Agende seu horário em Jundiaí.">
  <meta name="twitter:image" content="https://jlsanches-dev.github.io/mf-barbearia/img/foto-1.jpg">
  <meta name="twitter:image:alt" content="Bancada da MF Barbearia com espelhos redondos iluminados">
  <meta name="theme-color" content="#18191b">
  <link rel="icon" href="img/logo-topo.png" type="image/png">
  <link rel="apple-touch-icon" href="img/logo-topo.png">
  <link rel="sitemap" type="application/xml" href="sitemap.xml">

  <!-- Ficha da empresa para o Google e para IAs (JSON-LD).
       ATENÇÃO: se mudar horário, telefone, endereço ou preços no config.js,
       mude aqui também. -->

    "alternateName": "MF Barber - Matheus & Felipe",
    "slogan": "A número 1. De líder para líder.",
    "description": "Barbearia com Matheus e Felipe no Parque Almerinda Chaves, Jundiaí. Corte, barba, tratamentos e planos de assinatura.",

    "image": "https://jlsanches-dev.github.io/mf-barbearia/img/foto-1.jpg",
    "logo": "https://jlsanches-dev.github.io/mf-barbearia/img/logo-topo.png",
    "telephone": "+55-11-96427-7062",
    "priceRange": "R$ 5 a R$ 139,90",
    "currenciesAccepted": "BRL",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Rua José Ribeiro Barbosa, 115",
      "addressLocality": "Jundiaí",

      "addressCountry": "BR"
    },
    "geo": { "@type": "GeoCoordinates", "latitude": -23.1444919, "longitude": -46.9947631 },
    "areaServed": { "@type": "City", "name": "Jundiaí" },

    ],
    "sameAs": ["https://instagram.com/mf_barbeariia", "https://cashbarber.com.br/mfbarbearia"],
    "potentialAction": {
      "@type": "ReserveAction",

      "name": "Agendar horário"
    },
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Serviços",

        { "@type": "Offer", "price": "50.00", "priceCurrency": "BRL", "itemOffered": { "@type": "Service", "name": "Corte" } },
        { "@type": "Offer", "price": "30.00", "priceCurrency": "BRL", "itemOffered": { "@type": "Service", "name": "Corte careca" } },

        { "@type": "Offer", "price": "139.90", "priceCurrency": "BRL", "itemOffered": { "@type": "Service", "name": "Plano corte + barba ilimitados (mensal)" } }

  <link rel="preload" href="fontes/bodoni-moda-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fontes/fontes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="pular" href="#servicos">Pular para os serviços</a>

  <!-- TROCAR: aparece só se o celular não carregar o JavaScript -->
  <noscript>
    <p class="sem-js">MF Barbearia, Rua José Ribeiro Barbosa, 115, Pq Almerinda Chaves, Jundiaí - SP. WhatsApp (11) 96427-7062.</p>
  </noscript>

  <header class="topo">
    <a class="topo-marca" href="#" data-bloco="marca"></a>
    <a class="topo-link" href="#" data-link="agendamento" target="_blank" rel="noopener noreferrer">Agendar horário</a>
  </header>

  <main>
    <section class="hero" aria-labelledby="titulo-site">
      <figure class="espelho" data-foto="principal"></figure>
      <div class="hero-texto">
        <h1 id="titulo-site" data-campo="nome"></h1>
        <p class="slogan" data-campo="slogan"></p>
        <p class="local" data-campo="local"></p>
        <a class="nota" href="#" data-bloco="avaliacao" target="_blank" rel="noopener noreferrer"></a>
        <div class="acoes">
          <a class="botao botao-principal" href="#" data-link="agendamento" target="_blank" rel="noopener noreferrer">Agendar horário</a>
          <a class="botao botao-secundario" href="#" data-link="whatsapp" target="_blank" rel="noopener noreferrer">Chamar no WhatsApp</a>
        </div>
        <p class="status" data-bloco="status" aria-live="polite"></p>
      </div>
      <div class="led" aria-hidden="true"></div>
    </section>

    <section id="servicos" class="secao" aria-labelledby="titulo-servicos">
      <h2 id="titulo-servicos">Serviços</h2>
      <p class="aviso-exemplo" data-bloco="aviso-precos" hidden>Preços de exemplo. Confirme os valores no agendamento.</p>
      <div class="servicos-grade" data-bloco="servicos"></div>
      <div class="planos" data-bloco="planos"></div>
    </section>

    <section class="secao equipe" data-bloco="equipe" aria-labelledby="titulo-equipe">
      <div class="equipe-foto-caixa" data-foto="equipe"></div>
      <div class="equipe-texto">
        <h2 id="titulo-equipe" data-campo="equipe-titulo"></h2>
        <p data-campo="equipe-texto"></p>
      </div>
    </section>

    <section class="secao" data-bloco="depoimentos" aria-labelledby="titulo-depoimentos">
      <h2 id="titulo-depoimentos">Quem senta na cadeira</h2>
      <div class="depoimentos" data-bloco="lista-depoimentos"></div>
    </section>

    <section class="secao" aria-labelledby="titulo-galeria">
      <h2 id="titulo-galeria">O espaço</h2>
      <div class="galeria" data-bloco="galeria"></div>
    </section>

    <section class="secao" aria-labelledby="titulo-horarios">
      <h2 id="titulo-horarios">Horários</h2>
      <table class="horarios" data-bloco="horarios"></table>
    </section>

    <section class="secao" aria-labelledby="titulo-local">
      <h2 id="titulo-local">Como chegar</h2>
      <address class="endereco" data-bloco="endereco"></address>
      <div class="mapa" data-bloco="mapa"></div>
      <a class="botao botao-secundario" href="#" data-link="rota" target="_blank" rel="noopener noreferrer">Abrir rota no mapa</a>
    </section>
  </main>

  <footer class="rodape" data-bloco="rodape"></footer>

  <a class="whats-flutuante" href="#" data-link="whatsapp" target="_blank" rel="noopener noreferrer" aria-label="Conversar no WhatsApp">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16.04 3C9.4 3 4 8.38 4 15.01c0 2.12.56 4.19 1.62 6.01L4 29l8.17-1.58a12.1 12.1 0 0 0 3.87.63h.01C22.68 28.05 28 22.67 28 16.04 28 9.4 22.68 3 16.04 3Zm0 22.9h-.01a10 10 0 0 1-3.5-.64l-.25-.1-4.85.94.97-4.7-.16-.26a9.9 9.9 0 0 1-1.52-5.13c0-5.5 4.48-9.98 9.33-9.98 5.5 0 9.94 4.48 9.94 9.98 0 5.5-4.46 9.89-9.95 9.89Zm5.46-7.4c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49 0 1.47 1.07 2.89 1.22 3.09.15.2 2.1 3.2 5.08 4.49.71.31 1.27.49 1.7.63.71.23 1.36.2 1.88.12.57-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/></svg>
    <span>WhatsApp</span>
  </a>

  <dialog class="ampliar" data-bloco="ampliar" aria-label="Foto ampliada">
    <button type="button" class="ampliar-fechar" aria-label="Fechar foto">Fechar</button>
  </dialog>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
